<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}proto-pilot{% endblock %}</title>
<style>
:root{--bg:#fbfaf8;--fg:#1a1917;--mut:#6b6862;--line:#e3ded6;--card:#fff;--acc:#b4530a;--ok:#2f7d4f;--bad:#a32f2f}
@media(prefers-color-scheme:dark){:root{--bg:#151413;--fg:#eae7e1;--mut:#9a958c;--line:#2e2b28;--card:#1d1c1a;--acc:#e08b4a;--ok:#6fbf8f;--bad:#e08080}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:16px;align-items:baseline}
header a.brand{font-weight:640;color:var(--fg);text-decoration:none;letter-spacing:-.01em}
header nav a{color:var(--mut);text-decoration:none;margin-right:14px;font-size:14px}
header nav a:hover{color:var(--acc)}
a{color:var(--acc)}a:hover{text-decoration:underline}
main{max-width:940px;margin:0 auto;padding:26px 22px 70px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:14px}
.muted{color:var(--mut)}.small{font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:60px;resize:vertical}
button,.btn{display:inline-block;padding:8px 15px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;text-decoration:none}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:560}
button:hover,.btn:hover{border-color:var(--acc)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:13px;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.run{color:var(--acc);border-color:var(--acc)}.pill.done{color:var(--ok);border-color:var(--ok)}.pill.fail{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mut);font-style:italic;padding:8px 0}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">proto-pilot</a>
  <nav><a href="/">new</a></nav>
  {% if demo %}<span class="muted small" style="margin-left:auto">demo mode &mdash; tests hidden</span>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
