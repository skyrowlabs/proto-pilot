<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="proto.pilot — a paper plane flying off an idea and diving into an open box, beside the project name">
  <title>proto.pilot — turns an idea into a plan you can work from</title>
  <defs>
    <clipPath id="hero-clip"><rect width="1000" height="300" rx="18"/></clipPath>
    <radialGradient id="glow-a" cx="0.17" cy="0.55" r="0.6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b" cx="0.86" cy="0.15" r="0.5"><stop offset="0" stop-color="#818cf8" stop-opacity="0.12"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e8edf4" fill-opacity="0.07"/></pattern>
    <filter id="pp-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#hero-clip)">
    <rect width="1000" height="300" fill="#05090e"/>
    <rect width="1000" height="300" fill="url(#glow-a)"/>
    <rect width="1000" height="300" fill="url(#glow-b)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <!-- the mark: an idea, a flight path, and the box it lands in -->
    <g id="mark">
      <!-- the idea: a spark -->
      <g transform="translate(44,206)" filter="url(#pp-glow)">
        <path d="M0,-13 L3,-3 L13,0 L3,3 L0,13 L-3,3 L-13,0 L-3,-3 Z" fill="#c7d2fe">
          <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <g fill="#818cf8" fill-opacity="0.55">
        <circle cx="26" cy="186" r="1.8"/><circle cx="64" cy="222" r="1.6"/><circle cx="60" cy="186" r="1.2"/>
      </g>

      <!-- the flight path, from the spark up and over to the plane -->
      <path d="M 52,196 C 58,130 40,70 96,70" fill="none" stroke="#818cf8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7">
        <animate attributeName="stroke-dashoffset" values="18;0" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- and on from the plane into the box -->
      <path d="M 132,98 Q 154,116 162,138" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 6">
        <animate attributeName="stroke-dashoffset" values="16;0" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- the box: back flaps, opening, faces -->
      <g stroke-linejoin="round">
        <path d="M 113,170 L 165,140 L 150,104 L 98,134 Z" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.6"/>
        <path d="M 165,140 L 217,170 L 234,136 L 182,106 Z" fill="#818cf8" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.6"/>
        <path d="M 165,140 L 217,170 L 165,200 L 113,170 Z" fill="#0b1020" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.6"/>
        <path d="M 113,170 L 165,200 L 165,262 L 113,232 Z" fill="#818cf8" fill-opacity="0.20" stroke="#818cf8" stroke-width="2"/>
        <path d="M 165,200 L 217,170 L 217,232 L 165,262 Z" fill="#818cf8" fill-opacity="0.09" stroke="#818cf8" stroke-width="2"/>
      </g>
      <!-- container slats on the left face, drawn in the face's own plane -->
      <g transform="matrix(1,0.577,0,1,113,170)" fill="none" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
        <path d="M 9,18 H 43 M 9,31 H 43 M 9,44 H 43"/>
      </g>
      <!-- a running prompt on the right face -->
      <g transform="matrix(1,-0.577,0,1,165,200)" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12,15 L 20,28 L 12,36"/>
        <path d="M 24,36 H 34">
          <animate attributeName="stroke-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle cx="207" cy="226" r="3" fill="#a5b4fc" filter="url(#pp-glow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <!-- the paper plane, gliding toward the opening -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;3 -4;0 0" dur="3.6s" repeatCount="indefinite"/>
        <g transform="translate(118,82) rotate(30) scale(1.15)">
          <path d="M 30,0 L -22,-18 L -8,0 Z" fill="#e8edf4"/>
          <path d="M 30,0 L -8,0 L -16,14 Z" fill="#a5b4fc"/>
          <path d="M 30,0 L -8,0 L -12,6 Z" fill="#818cf8"/>
          <path d="M 30,0 L -22,-18 L -8,0 L -16,14 Z" fill="none" stroke="#05090e" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M 30,0 L -8,0" stroke="#05090e" stroke-width="1.2"/>
        </g>
      </g>
    </g>

    <text x="284" y="84" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8" fill="#818cf8">SKYROW.LABS · IDEA-TO-PLAN TOOL</text>
    <text x="280" y="172" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-1.8" fill="#e8edf4">proto.pilot</text>
    <text font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b6c2d1">
      <tspan x="284" y="214">Give it an idea and a little direction, and get back a plan:</tspan>
      <tspan x="284" y="242">the topics that matter, how they connect, where to start.</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1c2633"/>
</svg>
