# Unique per directory: two trees generated from the same idea must not
# share one compose project, or the second `up` adopts the first's
# containers and takes the first app down.
name: @@PROJECT@@

services:
  db:
    image: postgres:16-alpine
    labels:
      # Read back by `proto gc` and `proto ls`. The path is what makes an
      # orphan findable: a tree removed with `rm -rf` leaves these resources
      # behind, and this label is the only thing left pointing at what they
      # were for. See protopilot/containers.py, which owns the vocabulary.
      com.protopilot.slug: "@@APP_SLUG@@"
      com.protopilot.path: "@@PROJECT_PATH@@"
      com.protopilot.project: "@@PROJECT@@"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: @@APP_SLUG@@
    healthcheck:
      # The app waits on this rather than sleeping. A sleep is a race that
      # passes on your laptop and fails in CI.
      test: ["CMD-SHELL", "pg_isready -U app -d @@APP_SLUG@@"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Named, so what you save survives `proto down` and a restart. The cost
      # is real: there are no migrations, so a regenerated model against an
      # existing volume leaves a stale schema `create_all()` will not fix.
      # `proto down --purge` and `proto reset` drop it, and `proto add`
      # (which can change the schema) drops it automatically.
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    labels:
      com.protopilot.slug: "@@APP_SLUG@@"
      com.protopilot.path: "@@PROJECT_PATH@@"
      com.protopilot.project: "@@PROJECT@@"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/@@APP_SLUG@@
      APP_NAME: "@@APP_NAME@@"
      APP_PURPOSE: "@@APP_PURPOSE@@"
    ports:
      - "@@PORT@@:8000"
    volumes:
      # Hot reload: the repair loop edits app/ on the host and uvicorn picks
      # it up without a rebuild.
      - ./app:/srv/app
      - ./tests:/srv/tests

volumes:
  pgdata:
    labels:
      com.protopilot.slug: "@@APP_SLUG@@"
      com.protopilot.path: "@@PROJECT_PATH@@"
      com.protopilot.project: "@@PROJECT@@"

# The default network is labelled too. Compose creates it whether or not it
# is declared here, and an undeclared network is one `gc` cannot find.
networks:
  default:
    labels:
      com.protopilot.slug: "@@APP_SLUG@@"
      com.protopilot.path: "@@PROJECT_PATH@@"
      com.protopilot.project: "@@PROJECT@@"
