[project]
name = "proto-pilot"
version = "0.1.0"
description = "Turn an idea and a little direction into a running Dockerised prototype."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The end-to-end test generates a tree and runs that tree's own smoke suite in
# process, so proto-pilot's dev environment needs the generated app's stack too.
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

browser = [
    # Verification loads every screen in a real browser. Without this the
    # browser stage is skipped and reported as skipped -- never as green.
    "playwright>=1.50",
]

web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
proto = "protopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["protopilot", "protopilot.passes", "protopilot.web"]

[tool.setuptools.package-data]
protopilot = ["../skeleton/**/*", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
