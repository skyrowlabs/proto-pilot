[project]
name = "proto-pilot"
version = "0.1.0"
description = "Turn an idea and a little direction into a running prototype -- a terminal app by default, or a Dockerised web one."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "pydantic>=2.6",
    # The terminal target verifies IN PROCESS. There is no container between
    # proto-pilot and a generated terminal tree -- `verify_tui` runs that tree
    # under `sys.executable` -- so the framework it is built on has to be
    # importable wherever `proto` itself is installed. That is the durable
    # reason and it holds for anyone who ever types `--target tui`.
    #
    # It stops being avoidable at the default flip in Phase 6 of
    # `docs/implementations/spec/terminal-target.md`: `proto new` with no `--target` will build
    # a terminal app, so a machine without these two would go red at the
    # `import` stage on its first run and read that as a generation failure.
    #
    # The web target still needs neither at runtime -- its tree is built and
    # tested inside Docker -- which is why they were an extra until now.
    "sqlalchemy>=2.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    # EXACT, and they move together with `skeleton/tui/requirements.txt`: these
    # are the four versions a generated terminal tree pins, and
    # `tests/test_terminal_requirements.py` fails unless every pin there equals
    # the version installed here. CI installs every extra, so this is what holds
    # CI to what trees ship -- floating, each upstream release turned `develop`
    # red with no change in this repo. `dependencies` above still floats for
    # anyone who installs proto without extras.
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "sqlalchemy==2.1.1",
    "textual==8.2.8",
    # The end-to-end tests generate a tree and run that tree's own suite, so
    # this environment needs the WEB target's stack too. The terminal target's
    # is in `dependencies` above, because it is the product's now and not only
    # the test suite's.
    "fastapi>=0.115",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # `pytest-asyncio` is pinned above because a generated terminal tree's
    # smoke suite is `async def` with `asyncio_mode = auto`, and proto-pilot
    # runs it. The application itself does not need it; the suite it ships with does.
]

browser = [
    # Verification loads every screen in a real browser. Without this the
    # browser stage is skipped and reported as skipped -- never as green.
    "playwright>=1.50",
]

web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
proto = "protopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["protopilot", "protopilot.archetypes", "protopilot.passes", "protopilot.targets", "protopilot.web"]

[tool.setuptools.package-data]
protopilot = ["../skeleton/**/*", "web/templates/*.html"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.venv-ci
  | venv
  | build
  | dist
  | \.egg-info
  | node_modules
  | \.pytest_cache
  | tmp
)/
'''

[tool.isort]
profile = "black"
line_length = 120

# Asks git which files are ignored rather than keeping a second copy of
# `.gitignore` in the `skip` list below — which is the same reason every other
# discovered set in this repo is discovered rather than listed. The cost is that
# isort shells out to `git ls-files`, so in a tree that is not a repository git
# writes `fatal: not a git repository` to stderr three times and isort carries
# on with the skip silently doing nothing. That is not a case to design around:
# a scaffold gets `git init` and its first commit before it ever runs a gate.
skip_gitignore = true

# Name the first-party packages instead of letting isort infer them from what
# happens to be on disk. Inference reads the directories next to the cwd, so the
# same file sorts one way from the repo root and another from a subdirectory or
# a partial checkout — and the disagreement shows up as a formatter fight in
# review rather than as anything that looks like a config problem.
# `scanning` is listed beside `tests` and is not covered by it: `tests/` is not
# a package, so its modules are imported as siblings (`from scanning import ...`)
# and isort classifies an undeclared bare module as third-party — putting it in
# a block above the first-party imports it belongs with.
known_first_party = ["cli", "protopilot", "scripts", "tests", "scanning", "repo_files"]
skip = [".venv", ".venv-ci", "venv", ".git", "build", "dist", "node_modules", ".pytest_cache", "tmp"]

# Keep this block in sync with tests/pytest.ini. That file is the copy that
# applies when only a service directory plus tests/ is mounted; this one applies
# when pytest is invoked without a tests/ path argument.
[tool.pytest.ini_options]
addopts = "--strict-markers"
# `tmp/` holds generated prototype trees, each with its own tests/ that
# import an app this interpreter cannot see. `./pp test unit` selects by
# marker and never noticed; a bare `python -m pytest` collected them and
# died with 17 errors in a tree nobody was testing.
norecursedirs = ["tmp", "prototypes", ".venv", "skeleton"]
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]
timeout = 120
markers = [
    "unit: host-side tests, no running services required",
    "integration: requires the stack up and seeded",
    "manual: never in scheduled CI (E2E, live third-party, paid APIs)",
    "slow: slow-running test",
    "security: security test",
    "ui: drives a user interface — a TUI pilot, a browser, an Electron window",
]
